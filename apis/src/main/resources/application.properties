spring.application.name=apis

# ---------- Banco (H2, desenvolvimento) ----------
spring.datasource.url=jdbc:h2:mem:apisdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# evita query durante renderizacao de view
spring.jpa.open-in-view=false
# console do banco: desligado por padrao. LIGUE só no perfil local ou quando for usar.
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}

# ---------- Upload de arquivos ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---------- APITemplate.io (geracao de PDF) ----------
apitemplate.base-url=${APITEMPLATE_BASE_URL:https://rest.apitemplate.io/v2}
apitemplate.api-key=${APITEMPLATE_API_KEY}
apitemplate.template-id=${APITEMPLATE_TEMPLATE_ID:}
apitemplate.connect-timeout-ms=3000
apitemplate.read-timeout-ms=30000

# ---------- Cloudinary (imagens) ----------
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
cloudinary.pasta-padrao=${CLOUDINARY_PASTA_PADRAO:studio/}
cloudinary.connect-timeout-ms=3000
cloudinary.read-timeout-ms=15000

# ---------- Nylas (agenda) ----------
nylas.base-url=${NYLAS_BASE_URL:https://api.us.nylas.com}
nylas.api-key=${NYLAS_API_KEY}
nylas.grant-id=${NYLAS_GRANT_ID}
nylas.calendar-id=${NYLAS_CALENDAR_ID:primary}
nylas.notify-participantes=${NYLAS_NOTIFY_PARTICIPANTES:false}
nylas.connect-timeout-ms=3000
nylas.read-timeout-ms=15000

# ---------- Dados do estudio (usados no contrato) ----------
estudio.nome=${ESTUDIO_NOME:}
estudio.documento=${ESTUDIO_DOCUMENTO:}

# ---------- OpenAPI / Springdoc ----------
# desligado por padrao (vazamento de informacao); LIGUE no perfil local
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
