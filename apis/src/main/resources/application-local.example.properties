# application-local.example.properties — MODELO (valores falsos)
# Copie para application-local.properties e preencha com os valores reais.
# application-local.properties NUNCA e versionado (esta no .gitignore).
# Assim: cp application-local.example.properties application-local.properties

# ---- APITemplate.io (geracao do PDF do contrato) ----
apitemplate.base-url=https://rest.apitemplate.io/v2
apitemplate.api-key=SUA_CHAVE_AQUI
apitemplate.template-id=SEU_TEMPLATE_ID_AQUI

# ---- Nylas (agenda) ----
nylas.base-url=https://api.us.nylas.com
nylas.api-key=SUA_CHAVE_AQUI
nylas.grant-id=SEU_GRANT_ID_AQUI
nylas.calendar-id=primary

# ---- Cloudinary (imagens) ----
cloudinary.cloud-name=SEU_CLOUD_AQUI
cloudinary.api-key=SUA_KEY_AQUI
cloudinary.api-secret=SEU_SECRET_AQUI

# ---- dados do estudio (injetados no PDF) ----
estudio.nome=Nome do Estudio
estudio.documento=00000000000000

# ---- desenvolvimento: ligar recursos de debug SOMENTE no perfil local ----
# em producao (perfil padrao) Swagger/H2 ficam desligados por seguranca
spring.h2.console.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
