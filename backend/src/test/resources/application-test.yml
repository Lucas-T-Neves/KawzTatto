# =============================================================================
# Perfil de teste: banco H2 isolado por contexto, schema criado do zero e
# nenhuma fixture carregada (cada teste cria os dados que precisa).
# =============================================================================
spring:
  datasource:
    url: jdbc:h2:mem:kawztattoo-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      # Sem data-locations: nenhum dado mockado entra na suíte.

kawz:
  jwt:
    segredo: kawz-tattoo-teste-secret-0123456789abcdef-xyz
    validade-minutos: 60
