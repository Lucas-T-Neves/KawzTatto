spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    defer-datasource-initialization: false
  sql:
    init:
      mode: never
  # Desliga o usuário/senha gerados pelo Spring Security: a autenticação é só JWT.
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

kawz:
  jwt:
    segredo: ${JWT_SECRET}

server:
  forward-headers-strategy: framework